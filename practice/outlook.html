<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Practice mail</title>
<style>
  body { margin: 0; font: 15px/1.5 -apple-system, system-ui, sans-serif; background: #f3f2f1; color: #201f1e }
  .bar { background: #3d4a6b; color: #fff; padding: 10px 18px; font-weight: 600 }
  .bar small { font-weight: 400; opacity: .8; margin-left: 10px }
  .compose { max-width: 760px; margin: 24px auto; background: #fff; border: 1px solid #e1dfdd; border-radius: 6px; padding: 18px 22px }
  .row { display: flex; align-items: center; border-bottom: 1px solid #edebe9; padding: 6px 0 }
  .row label { width: 70px; color: #605e5c }
  .row input { flex: 1; border: 0; font: inherit; padding: 6px; outline: none }
  textarea { width: 100%; min-height: 260px; border: 0; font: inherit; margin-top: 10px; outline: none; resize: vertical }
  .actions { display: flex; gap: 8px; margin-top: 10px }
  button { font: inherit; padding: 6px 16px; border-radius: 4px; border: 1px solid #8a8886; background: #fff; cursor: pointer }
  button.primary { background: #3d4a6b; color: #fff; border-color: #3d4a6b }
  .error { color: #a4262c; margin-top: 8px; display: none }
  .done { max-width: 760px; margin: 60px auto; text-align: center; display: none }
</style></head>
<body>
<div class="bar">Practice mail <small>Not Outlook. Nothing here is sent anywhere.</small></div>
<form class="compose" id="compose" aria-label="New message">
  <div class="row"><label for="to">To</label><input id="to" name="to" aria-label="To"></div>
  <div class="row"><label for="cc">Cc</label><input id="cc" name="cc" aria-label="Cc"></div>
  <div class="row"><label for="subject">Subject</label><input id="subject" name="subject" aria-label="Subject"></div>
  <textarea id="body" aria-label="Message body"></textarea>
  <div class="actions"><button type="submit" class="primary">Send</button><button type="button" id="discard">Discard</button></div>
  <div class="error" id="err">Add at least one recipient and a subject.</div>
</form>
<div class="done" id="done" role="status"><h2>Message sent</h2><p>Practice only: it went nowhere.</p></div>
<script>
  window.__practice = { system: 'outlook', sent: null };
  document.getElementById('compose').addEventListener('submit', function (e) {
    e.preventDefault();
    var to = document.getElementById('to').value.trim(), subject = document.getElementById('subject').value.trim();
    if (!to || !subject) { document.getElementById('err').style.display = 'block'; return; }
    window.__practice.sent = { to: to, cc: document.getElementById('cc').value.trim(), subject: subject,
                               body: document.getElementById('body').value };
    document.getElementById('compose').style.display = 'none';
    document.getElementById('done').style.display = 'block';
  });
</script>
</body></html>
