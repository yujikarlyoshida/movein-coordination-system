<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Mock shaped like Xfinity Communities (tests only)</title></head>
<body>
<!-- Test fixture only. Shaped like what the read-only probes found on Xfinity
     Communities: Prism-style web components with open shadow roots, test ids
     residents_hero_add_button and resident-contact-details-*, a footer Continue
     button by test id, an inner native button taking the click; then, as mapped
     on the live wizard, a unit search (input data-testid unit-test inside a
     component) whose results are option buttons named "APT 611" over a street
     address, a move-in date picker (resident-occupancy-dates-move-in-date,
     MM/DD/YYYY), and a review with Save where Continue was. Fictional, saves
     nothing. -->
<div id="page"></div>
<script>
  // Minimal Prism-like components: each wraps a native control in a shadow root.
  class PrismButton extends HTMLElement {
    connectedCallback() {
      if (this.shadowRoot) return;
      // As live: some buttons are drawn a moment after they appear.
      if (this.hasAttribute('data-late') && !this.__late) { this.__late = true; setTimeout(() => this.connectedCallback(), 900); return; }
      const r = this.attachShadow({ mode: 'open' });
      const b = document.createElement('button');
      b.textContent = this.textContent.trim();
      // Like the real one: the host itself ignores clicks; the inner button acts.
      b.addEventListener('click', () => this.dispatchEvent(new CustomEvent('prism-click', { bubbles: true, composed: true })));
      r.appendChild(b);
    }
  }
  class PrismInputText extends HTMLElement {
    connectedCallback() {
      if (this.shadowRoot) return;
      const r = this.attachShadow({ mode: 'open' });
      const i = document.createElement('input');
      i.type = this.getAttribute('type') || 'text';
      i.setAttribute('aria-label', this.getAttribute('label') || '');
      if (this.getAttribute('inner-testid')) i.setAttribute('data-testid', this.getAttribute('inner-testid'));
      if (this.getAttribute('placeholder')) i.placeholder = this.getAttribute('placeholder');
      r.appendChild(i);
    }
    get value() { return this.shadowRoot.querySelector('input').value; }
  }
  class PrismSelect extends HTMLElement {
    connectedCallback() {
      if (this.shadowRoot) return;
      const r = this.attachShadow({ mode: 'open' });
      const s = document.createElement('select');
      ['', '0735', '1408', '0611'].forEach(u => { const o = document.createElement('option'); o.value = u; o.textContent = u || 'Choose a unit'; s.appendChild(o); });
      r.appendChild(s);
    }
    get value() { return this.shadowRoot.querySelector('select').value; }
  }
  customElements.define('prism-button', PrismButton);
  customElements.define('prism-input-text', PrismInputText);
  customElements.define('prism-select', PrismSelect);

  // reviewOmits: a field the review leaves out; failSave: refuse the save.
  // goProps(names): start on the organisation's property list, as live after a
  // restart -- one focusable card per property, no links.
  window.__mock = { saved: [], presses: 0, opened: [],
    goProps(names) {
      at = 'props';
      page.innerHTML = names.map((n, i) => `<div tabindex="0" class="card" data-i="${i}"><prism-text>${n}</prism-text>
        <prism-text>100 Example St</prism-text><prism-text>Units</prism-text><prism-text>12</prism-text>
        <prism-text>Residents</prism-text><prism-text>3</prism-text></div>`).join('');
      page.querySelectorAll('.card').forEach(c => c.addEventListener('click', () => { window.__mock.opened.push(names[+c.dataset.i]); show('list'); }));
      return '1';
    } };
  const page = document.getElementById('page');
  const state = {};
  const footer = (label) => `<prism-button data-testid="resident-create-footer-back-button">Back</prism-button>
    <prism-button data-testid="resident-create-footer-continue-button">${label}</prism-button>`;
  const screens = {
    list: () => `<prism-button data-late data-testid="residents_hero_add_button">Add resident</prism-button>`,
    contact: () => `<prism-input-text label="First name" data-testid="resident-contact-details-first-name"></prism-input-text>
      <prism-input-text label="Last name" data-testid="resident-contact-details-last-name"></prism-input-text>
      <prism-input-text label="Email" type="email" data-testid="resident-contact-details-email"></prism-input-text>
      <prism-input-text label="Phone number" data-testid="resident-contact-details-phone-number"></prism-input-text>` + footer('Continue'),
    unit: () => `<prism-text data-testid="resident-location-title">Select Unit</prism-text>
      <prism-input-text inner-testid="unit-test" placeholder="Search by unit name or address"></prism-input-text>
      <div id="results" data-testid="resident-location-typeahead"></div>` + footer('Continue'),
    dates: () => `<prism-datepicker data-testid="resident-occupancy-dates-move-in-date" label="Move in date">
        <prism-input-text placeholder="MM/DD/YYYY" data-testid="move-in-box"></prism-input-text></prism-datepicker>
      <prism-datepicker data-testid="resident-occupancy-dates-move-out-date" label="Move out date (optional)">
        <prism-input-text placeholder="MM/DD/YYYY" data-testid="move-out-box"></prism-input-text></prism-datepicker>` + footer('Continue'),
    review: () => `<prism-text>${['first', 'last', 'email', 'phone', 'unit', 'movein']
        .filter(k => k !== window.__mock.reviewOmits).map(k => state[k]).join(' ')}</prism-text>`
      + `<div id="banner"></div>` + footer('Save resident'),
  };
  // The unit search: matching units appear as option buttons, like the live site.
  const UNITS = ['APT 611', 'APT 1611', 'APT 735', 'APT 1408'];
  page.addEventListener('input', e => {
    if (at !== 'unit') return;
    const q = (e.composedPath()[0].value || '').trim();
    state.unit = '';
    const hits = q ? UNITS.filter(u => u.includes(q)) : [];
    document.getElementById('results').innerHTML = hits.length
      ? `<prism-text>${hits.length} results found</prism-text>` + hits.map(u =>
          `<button role="option" aria-selected="false" data-unit="${u}"><prism-text>${u}</prism-text><prism-text>100 EXAMPLE ST</prism-text></button>`).join('')
      : `<prism-text>Sorry, we didn't find results.</prism-text>`;
  });
  page.addEventListener('click', e => {
    const b = e.target.closest && e.target.closest('button[role=option]');
    if (!b) return;
    page.querySelectorAll('button[role=option]').forEach(o => o.setAttribute('aria-selected', 'false'));
    b.setAttribute('aria-selected', 'true');
    state.unit = b.dataset.unit;
  });
  let at = 'list';
  // As live: the unit screen is drawn in stages, its footer first and the
  // search a moment later.
  const show = name => {
    at = name;
    if (name === 'unit') {
      page.innerHTML = footer('Continue');
      setTimeout(() => { if (at === 'unit') page.innerHTML = screens.unit(); }, 700);
      return;
    }
    page.innerHTML = screens[name]();
  };
  const val = id => { const e = page.querySelector(`[data-testid="${id}"]`); return e ? e.value : ''; };
  page.addEventListener('prism-click', e => {
    const id = e.target.getAttribute('data-testid');
    if (id === 'residents_hero_add_button') return show('contact');
    if (id !== 'resident-create-footer-continue-button') return;
    if (at === 'contact') {
      Object.assign(state, { first: val('resident-contact-details-first-name'), last: val('resident-contact-details-last-name'),
                             email: val('resident-contact-details-email'), phone: val('resident-contact-details-phone-number') });
      if (!state.first || !state.last || !state.email || !/^\d{3}-\d{3}-\d{4}$/.test(state.phone)) return;
      return show('unit');
    }
    if (at === 'unit') { if (!state.unit) return; return show('dates'); }
    if (at === 'dates') { state.movein = val('move-in-box'); if (!/^\d\d\/\d\d\/\d{4}$/.test(state.movein)) return; return show('review'); }
    if (at === 'review') {
      window.__mock.presses++;
      // window.__mock.failSave: refuse like the live site does, with its banner.
      if (window.__mock.failSave) {
        document.getElementById('banner').innerHTML = `<prism-banner data-testid="res-create-error-banner">
          <prism-text data-testid="res-create-error-banner-description">An unknown error occurred. Please try again.</prism-text></prism-banner>`;
        return;
      }
      window.__mock.saved.push(Object.assign({}, state)); return show('list');
    }
  });
  show('list');
</script>
</body></html>
